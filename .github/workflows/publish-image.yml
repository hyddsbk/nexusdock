name: Publish container

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Commit SHA, branch, or tag to publish. Defaults to the workflow ref.
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'publish-*'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Full CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TARGET: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TARGET" ]]; then
            target="$DISPATCH_TARGET"
          elif [[ "$REF_NAME" == publish-* ]]; then
            target="${REF_NAME#publish-}"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || {
              echo "publish-* tags must end with a full 40-character commit SHA" >&2
              exit 1
            }
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate, test and build
        run: make ci

      - name: Verify generated files are committed
        run: git diff --exit-code

  publish:
    name: Publish container images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      revision: ${{ steps.buildmeta.outputs.revision }}
      dockerhub_enabled: ${{ steps.registries.outputs.dockerhub_enabled }}
    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TARGET: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TARGET" ]]; then
            target="$DISPATCH_TARGET"
          elif [[ "$REF_NAME" == publish-* ]]; then
            target="${REF_NAME#publish-}"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || {
              echo "publish-* tags must end with a full 40-character commit SHA" >&2
              exit 1
            }
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Resolve build version and revision
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --always --dirty)"
          revision="$(git rev-parse HEAD)"
          short_revision="$(git rev-parse --short=7 HEAD)"
          semver="${version#v}"
          is_semver=false
          stable=false
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            is_semver=true
            if [[ "$version" != *-* ]]; then
              stable=true
            fi
          fi
          {
            echo "version=${version}"
            echo "revision=${revision}"
            echo "short_revision=${short_revision}"
            echo "semver=${semver}"
            echo "is_semver=${is_semver}"
            echo "stable=${stable}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve registry availability
        id: registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are not configured; publishing GHCR only."
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=agentdockio/nexusdock,enable=${{ steps.registries.outputs.dockerhub_enabled == 'true' }}
          tags: |
            type=raw,value=sha-${{ steps.buildmeta.outputs.short_revision }}
            type=raw,value=${{ steps.buildmeta.outputs.semver }},enable=${{ steps.buildmeta.outputs.is_semver == 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.buildmeta.outputs.stable == 'true' }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXUS_VERSION=${{ steps.buildmeta.outputs.version }}
            NEXUS_REVISION=${{ steps.buildmeta.outputs.revision }}
            NEXUS_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nexusdock-runtime
          cache-to: type=gha,mode=max,scope=nexusdock-runtime,ignore-error=true

      - name: Report published digest
        run: |
          echo "digest=${{ steps.push.outputs.digest }}"
          echo "revision=${{ steps.buildmeta.outputs.revision }}"
          echo "dockerhub_enabled=${{ steps.registries.outputs.dockerhub_enabled }}"

  verify:
    name: Verify published container images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_REVISION: ${{ needs.publish.outputs.revision }}
      DOCKERHUB_ENABLED: ${{ needs.publish.outputs.dockerhub_enabled }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify image revision matches target commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" == sha256:* ]] || {
            echo "invalid published digest: ${PUBLISHED_DIGEST}" >&2
            exit 1
          }
          images=("ghcr.io/${GITHUB_REPOSITORY}@${PUBLISHED_DIGEST}")
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            images+=("agentdockio/nexusdock@${PUBLISHED_DIGEST}")
          fi
          for image in "${images[@]}"; do
            echo "Checking revision of ${image}"
            docker pull "$image"
            revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
              echo "OCI revision mismatch: got ${revision}, want ${EXPECTED_REVISION}" >&2
              exit 1
            fi
            docker run --rm --entrypoint sh -e NEXUS_EXPECTED_REVISION="$EXPECTED_REVISION" "$image" -c 'grep -q "$NEXUS_EXPECTED_REVISION" /usr/local/bin/nexusdock'
          done

      - name: Pull and run published images
        shell: bash
        run: |
          set -euo pipefail
          images=("ghcr.io/${GITHUB_REPOSITORY}@${PUBLISHED_DIGEST}")
          if [[ "$DOCKERHUB_ENABLED" == "true" ]]; then
            images+=("agentdockio/nexusdock@${PUBLISHED_DIGEST}")
          fi
          for image in "${images[@]}"; do
            echo "Verifying ${image}"
            docker pull "$image"
            name="nexus-verify-${RANDOM}"
            docker run -d --name "$name" "$image"
            ready=false
            for _ in $(seq 1 30); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name")"
              if [[ "$status" == healthy ]]; then
                ready=true
                break
              fi
              if [[ "$(docker inspect -f '{{.State.Status}}' "$name")" == exited ]]; then
                docker logs "$name"
                exit 1
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              docker inspect "$name"
              docker logs "$name"
              exit 1
            fi
            docker inspect -f '{{json .RepoDigests}}' "$image"
            docker rm -f "$name"
          done
