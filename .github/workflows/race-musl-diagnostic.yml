name: Race gate regression

on:
  push:
    branches:
      - fix/race-ci-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Hosted Alpine control remains race-clean
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            golang:1.26-alpine \
            sh -c '
              set -eu
              apk add --no-cache build-base git >/dev/null
              /usr/local/go/bin/go test -race ./internal/core
            '

      - name: Known-noise classifier remains narrow
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/test-race-classifier.sh

      - name: Known noise downgrades but unknown race stays blocking
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            alpine:3.20 \
            sh -c '
              set -eu
              mkdir -p /tmp/fakebin
              cp scripts/testdata/fake-go.sh /tmp/fakebin/go
              chmod +x /tmp/fakebin/go

              PATH="/tmp/fakebin:$PATH" \
                RACE_GATE_FIXTURE="/src/scripts/testdata/race-known-musl.log" \
                sh scripts/test-race.sh

              set +e
              PATH="/tmp/fakebin:$PATH" \
                RACE_GATE_FIXTURE="/src/scripts/testdata/race-real.log" \
                sh scripts/test-race.sh > /tmp/unknown-race.log 2>&1
              rc=$?
              set -e

              cat /tmp/unknown-race.log
              test "$rc" -ne 0
              grep -F "unknown or mixed report" /tmp/unknown-race.log
            '

      - name: Real race detector sentinel remains blocking
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src/scripts/testdata/racecanary \
            golang:1.26-alpine \
            sh -c '
              set -eu
              set +e
              /usr/local/go/bin/go test -race ./... > /tmp/real-race.log 2>&1
              rc=$?
              set -e
              cat /tmp/real-race.log
              test "$rc" -ne 0
              grep -F "WARNING: DATA RACE" /tmp/real-race.log
            '
